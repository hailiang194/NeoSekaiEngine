name: Pipeline
run-name: ${{ github.ref }} on ${{ github.repository }} is being built and tested out Github actions
on: 
    push:
        branches:
            - 'main'
            - 'development'
            - "add/**"
    pull_request:
jobs:
    Pipeline-Ubuntu:
        strategy:
            fail-fast: false
            matrix:
                compiler: ["gcc", "clang"]
                config: ["Debug", "Release"]
                build_shared: [0, 1]
                include: 
                  - compiler: "gcc"
                    C: gcc
                    CXX: g++
                  - compiler: "clang"
                    C: clang
                    CXX: clang++
        runs-on: ubuntu-latest
        steps:
            - name: build onwith compiler is ${{ matrix.compiler }} and BUILD_SHARED_LIBS=${{ matrix.build_shared }} in config=${{ matrix.config }}
              run: echo "information os=ubuntu-latest compiler=${{ matrix.compiler }} build_shared=${{ matrix.build_shared }} config=${{ matrix.config }}"
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Install packages for Ubuntu
              run: /bin/bash ./scripts/pre-installer/linux/debian/preinstaller.sh
            - name: Generate project for Unix makefile
              env:
                CC: ${{ matrix.compiler.C }}
                CXX: ${{ matrix.compiler.CXX }}
              run: cmake -S ./ -B ./build -DRUN_TEST=1 -DBUILD_ENGINE_EXAMPLES=1 -DBUILD_SHARED_LIBS=${{ matrix.build_shared }} -G "Unix Makefiles"
            - name: Build project
              run: cmake --build build --config ${{ matrix.config }}
            - name: run test for Unix makefile
              run: ./build/out/engine_test --gtest_output="xml:build/test-results.xml"
            - name: run logging self-check for Unix makefile
              run: python3 ./scripts/run_log_selftest.py ./build/out/log_selftest
            - name: Upload test result
              uses: actions/upload-artifact@v4
              with:
                name: test-results-ubuntu-${{matrix.compiler}}-${{ matrix.config }}-${{ matrix.build_shared }}.xml
                path: build/test-results.xml
            - name: Upload examples for Unix makefile
              uses: actions/upload-artifact@v4
              with:
                name: examples-ubuntu-${{matrix.compiler}}-${{ matrix.config }}-${{ matrix.build_shared }}
                path: build/out

    Pipeline-Windows:
      strategy:
          fail-fast: false
          matrix:
              compiler: ["MSVC", "gcc", "clang"]
              config: ["Debug", "Release"]
              build_shared: [0, 1]
              include: 
                - compiler: "gcc"
                  C: gcc
                  CXX: g++
                - compiler: "clang"
                  C: clang-cl
                  CXX: clang-cl
      runs-on: windows-latest
      steps:
          - name: build onwith compiler is ${{ matrix.compiler }} and BUILD_SHARED_LIBS=${{ matrix.build_shared }} in config=${{ matrix.config }}
            run: echo "information os=ubuntu-latest compiler=${{ matrix.compiler }} build_shared=${{ matrix.build_shared }} config=${{ matrix.config }}"
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Generate project for Unix makefile
            env:
              CC: ${{ matrix.compiler.C }}
              CXX: ${{ matrix.compiler.CXX }}
            if: ${{ matrix.compiler != 'MSVC' }}
            run: cmake -S ./ -B ./build -DRUN_TEST=1 -DBUILD_ENGINE_EXAMPLES=1 -DBUILD_SHARED_LIBS=${{ matrix.build_shared }} -G "Unix Makefiles"
          - name: Generate project for Visual Studio
            if: ${{ matrix.compiler == 'MSVC' }}
            run: cmake -S ./ -B ./build -DRUN_TEST=1 -DBUILD_ENGINE_EXAMPLES=1 -DBUILD_SHARED_LIBS=${{ matrix.build_shared }}
          - name: Build project
            run: cmake --build build --config ${{ matrix.config }}
          - name: run test for MSVC
            if: ${{ matrix.compiler == 'MSVC' }}
            run: .\build\out\${{ matrix.config }}\engine_test.exe --gtest_output="xml:build/test-results.xml"
          - name: run test for Unix makefile
            if: ${{ matrix.compiler != 'MSVC' }}
            run: ./build/out/engine_test --gtest_output="xml:build/test-results.xml"
          - name: run logging self-check for MSVC
            if: ${{ matrix.compiler == 'MSVC' }}
            run: python ./scripts/run_log_selftest.py .\build\out\${{ matrix.config }}\log_selftest.exe
          - name: run logging self-check for Unix makefile
            if: ${{ matrix.compiler != 'MSVC' }}
            run: python ./scripts/run_log_selftest.py ./build/out/log_selftest
          - name: Upload crash dumps
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: crash-dumps-${{matrix.compiler}}-${{ matrix.config }}-${{ matrix.build_shared }}
              path: crash-*.log
              if-no-files-found: ignore
          - name: Upload test result
            uses: actions/upload-artifact@v4
            with:
              name: test-results-window-${{matrix.compiler}}-${{ matrix.config }}-${{ matrix.build_shared }}.xml
              path: build/test-results.xml
          - name: Upload examples for MSVC
            uses: actions/upload-artifact@v4
            if: ${{ matrix.compiler != 'MSVC' }}
            with:
              name: examples-window-${{matrix.compiler}}-${{ matrix.config }}-${{ matrix.build_shared }}
              path: build/out    
          - name: Upload examples for Unix makefile
            uses: actions/upload-artifact@v4
            if: ${{ matrix.compiler == 'MSVC' }}
            with:
              name: examples-window-${{matrix.compiler}}-${{ matrix.config }}-${{ matrix.build_shared }}
              path: build/out/${{ matrix.config }}

    Build-WebAssembly:
      strategy:
        fail-fast: false
        matrix: 
          config: ["Debug", "Release"]
      runs-on: "ubuntu-latest"
      steps:
        - name: Check out the repository code
          uses: actions/checkout@v4
        - name: Setup emsdk
          uses: mymindstorm/setup-emsdk@v14
          with:
            version: 4.0.7
            actions-cache-folder: 'emsdk-cache'
        - name: setup library
          run: /bin/bash ./scripts/pre-installer/linux/debian/preinstaller.sh
        - name: Generate project
          run: cmake -S . -B build -DPLATFORM=Web -DBUILD_SHARED_LIBS=0 -DBUILD_ENGINE_EXAMPLES=1 -DCMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake
        - name: Build project
          run: cmake --build ./build --config ${{ matrix.config }}     
        - name: Assert ES6 module output (no .html shell)
          run: |
            if find build/out -name '*.html' | grep -q .; then
              echo "unexpected .html shell emitted:"; find build/out -name '*.html'
              exit 1
            fi
            test -f build/out/BasicWindow/BasicWindow.js
            test -f build/out/BasicWindow/BasicWindow.wasm
            echo "ES6 module pair present in build/out/BasicWindow/"
        - name: Build with web UI and assert staged game output
          run: |
            cmake -S . -B build-web-ui -DPLATFORM=Web -DBUILD_SHARED_LIBS=0 -DBUILD_ENGINE_EXAMPLES=1 \
              -DBUILD_WEB_UI=ON -DCMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake
            cmake --build build-web-ui --config ${{ matrix.config }}
            for dir in build-web-ui/out/*/; do
              game=$(basename "$dir")
              for f in index.html "$game.js" "$game.wasm"; do
                test -f "$dir$f" || { echo "missing $dir$f"; exit 1; }
              done
              # A .data must carry named VFS entries: an empty preload destination makes
              # emcc emit one nameless "/" entry, which then fails to mknod at runtime.
              if [ -f "$dir$game.data" ]; then
                if grep -q '"filename": "/",' "$dir$game.js"; then
                  echo "$game: nameless entry in preloaded data"; exit 1
                fi
                echo "$game: UI + module pair + named .data"
              else
                echo "$game: UI + module pair (no assets declared, no .data)"
              fi
            done
        - name: Upload WebAssembly
          uses: actions/upload-artifact@v4
          with:
            name: webassembly-${{ matrix.config }}
            path: build/out

    Generate-Docs:
      runs-on: "ubuntu-latest"
      needs: [Pipeline-Ubuntu, Pipeline-Windows, Build-WebAssembly]
      steps:
        - name: install doxygen and graphviz
          run: sudo apt-get -y install doxygen graphviz
        - name: Check out the repository code
          uses: actions/checkout@v4
        - name: setup library
          run: /bin/bash ./scripts/pre-installer/linux/debian/preinstaller.sh 
        - name: build project with test for shared lib
          run: cmake -S ./ -B ./build -DBUILD_DOC=1 -DBUILD_SHARED_LIBS=1 && cmake --build ./build --target EngineDoc
        - name: Upload test result
          uses: actions/upload-artifact@v4
          with:
            name: html-docs
            path: build/doc/html
